<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opreração logica</title>
</head>
<body>
    <script>
        // Operadores logicos
        // Esses operadores são para combinar expressões lógicas

        // Operador logico E (&&):  Retorna verdadeiro (true) se ambas as expressões forem verdadeiras

        let nome = true
        let senha = true

        let resultado = nome && senha 
        console.log(resultado)

        nome = 'Diego'
        senha = '1914'

        resultado = nome == "Diego" && senha == "1914"

        console.log(resultado)


        // Operador logico OU (||): Retorna verdadeiro se pelo menos uma das expressões forem verdadeiras

        let nome = true
        let senha = true

        let resultado = nome && senha 
        console.log(resultado)

        nome = 'Diego'
        senha = '1914'

        resultado = nome == "Diego" || senha == "1914"

        console.log(resultado)

    </script>
    
</body>
</html>
