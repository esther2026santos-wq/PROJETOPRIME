<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Prime | Liberdade Financeira Inteligente</title>
    <link rel="stylesheet" href="CSS/stile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>


<body>
<!-- Header : define o o cabeçalho da pagina , geralmente contendo navegação e logotipo-->
<header class="navbar">
    <div class="container flex-nav">
        <!-- essa div contem o Logotipo do site, com apan para estilizar parte do texto-->
        <div class="logo">GESTÃO<span>PRIME</span></div>
    </div>
    <!-- tag nav define uma seção de navegação-->
    <nav class="nav-menu">
        <!-- ul : lista não ordenada para itens do menu-->
        <ul>
            <!-- li: item de listas; a: Link ancora para seçoês da pagina-->
            <li><a href="#home">HOME</a></li>
            <li><a href="#features">Funcionalidades</a></li>
            <li><a href="#plan">Planos</a></li>
            <li><a href="#blog">Blog</a></li>
            <li><a href="#contact">Contato</a></li>
        </ul>
        <!-- div nav-btns: agrupa botoes de navegação-->
        <div class="nav-btns">
            <a href="#" class="btn btn-outiline">Login</a>
            <a href="#" class="btn btn-neon">Criar sua conta</a>
        </div>
        <!--div menu-toggle ? Botão do menu para dispositivos moveis-->
        <div class="menu-toggle" id="mobile-menu">
            <!--span: Elementos para criar icones do menu hamburguer-->
            <span></span>
            <span></span>
            <span></span>
        </div>

    </nav>
</header>    
</body>
</html>
